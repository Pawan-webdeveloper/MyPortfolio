<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Hero Preview</title>
    <style>
      html, body { margin: 0; height: 100%; background: #6f8f8c; }
      body { display: flex; }
      #h { flex: 1; height: 100vh; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="h"></div>
    <script type="module">
      // dev aid: ?view=full|face|torso&yaw=0.3&bg=%23hex
      import { mountHero } from "../hero.js";
      const q = new URLSearchParams(location.search);
      if (q.get("bg")) document.body.style.background = q.get("bg");
      window.hero = await mountHero(document.getElementById("h"), {
        view: q.get("view") || "full",
        yaw: q.has("yaw") ? +q.get("yaw") : undefined,
      });
    </script>
  </body>
</html>
